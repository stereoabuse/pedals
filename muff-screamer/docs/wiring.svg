<text x="3" y="207.5" font-size="2.3" fill="#333">Each footswitch only shorts its FS pad to a G pad, so one pole of any latching switch does it (two lugs of a 3PDT).</text>
<text x="3" y="210.7" font-size="2.3" fill="#333">No signal passes through the footswitches. The output jack grounds through the metal enclosure.</text>
